name: Build app for my phone

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: Thonix

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      # Same key on every build, so a new build installs over the old one.
      - name: Load my signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_B64}" ]; then
            echo "::error::The secret DEBUG_KEYSTORE_B64 is missing or empty."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          if ! keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "::error::The signing key could not be read. Create the secret again from make_signing_key.py."
            exit 1
          fi
          FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/ && !seen {print $2; seen=1}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "KEY_FINGERPRINT=$FP" >> "$GITHUB_ENV"
          echo "Signing key loaded. Fingerprint: $FP"

      # The original project's code stays untouched in the repo; the name is applied here.
      - name: Name the app
        run: |
          set -euo pipefail
          grep -rl 'OpenPhoneUse' app/src/main --include='*.kt' --include='*.xml' \
            | grep -v -e 'auth/PlanAuth.kt' -e 'mcp/McpOAuth.kt' -e 'settings/LicensesScreen.kt' \
            | xargs sed -i "s/OpenPhoneUse/${APP_NAME}/g"
          grep -q "<string name=\"app_name\" translatable=\"false\">${APP_NAME}</string>" app/src/main/res/values/strings.xml
          echo "App named ${APP_NAME}."

      # My private lock list: apps Thonix never opens, reads or operates.
      - name: Attach my lock list
        env:
          LOCKED_APPS: ${{ secrets.LOCKED_APPS }}
        run: |
          python3 - <<'LOCK_PY'
          """Adds the owner's lock list to the app's code before it is built.

          Runs on GitHub during the build. The list comes from the LOCKED_APPS secret,
          so the app names never appear in the public repository or in the build log.
          Every change is checked: if the app's code has moved and the lock cannot be
          attached in exactly the expected place, the build stops instead of producing
          an app without the lock.
          """

          import os
          import pathlib
          import re
          import sys

          SRC = pathlib.Path("app/src/main/java/com/phoneuse")
          MIN_WORD = 3


          def stop(message: str) -> None:
              print(f"::error::{message}")
              sys.exit(1)


          def lock_words() -> list[str]:
              raw = os.environ.get("LOCKED_APPS", "")
              if not raw.strip():
                  stop("The secret LOCKED_APPS is missing. Add it (app names separated by commas), or set it to: none")
              words: list[str] = []
              for position, part in enumerate(re.split(r"[,;\n]+", raw), start=1):
                  word = re.sub(r"[^a-z0-9]", "", part.lower())
                  if not word or word == "none":
                      continue
                  if len(word) < MIN_WORD:
                      stop(f"Entry number {position} in LOCKED_APPS is shorter than {MIN_WORD} letters, which would lock too many apps.")
                  if word not in words:
                      words.append(word)
              return words


          OWNER_LOCK = r'''package com.phoneuse.security

          import java.util.concurrent.ConcurrentHashMap

          /**
           * The owner's lock list: apps the assistant never opens, reads or operates, whatever the model asks.
           * The words come from the build (see OwnerLockWords). A word locks every app whose package name contains
           * it, or whose visible name does: inside one part of the name ("MyOPay") or running across parts from the
           * start of one ("Monie Point"). Case is ignored.
           */
          object OwnerLock {
              /** What the model gets in place of a locked app's screen, and as the refusal to open one. */
              const val NOTICE =
                  "LOCKED BY OWNER: the owner put this app on their private lock list, so it is not operated: it is not " +
                      "opened, its screen is not read and taps, typing and scrolling in it are refused. Do not try other " +
                      "ways in (no links, no search, no other app that reaches the same account). Finish now: tell the " +
                      "user this app is on their lock list, so they need to do this part themselves, and give them " +
                      "whatever else they asked for that you could do."

              private val NOT_LETTERS = Regex("[^\\p{L}\\p{N}]+")

              private val words: List<String> = OwnerLockWords.WORDS.map { letters(it) }.filter { it.length >= 3 }.distinct()

              /** Package name to locked or not, for every app learned or asked about. */
              private val known = ConcurrentHashMap<String, Boolean>()

              /** False when the list is empty: then nothing is locked and nothing is looked up. */
              val active: Boolean get() = words.isNotEmpty()

              /** True for a package not yet matched against the installed apps' visible names. */
              fun unknown(packageName: String): Boolean = active && !known.containsKey(packageName)

              /** Records the installed apps (package name to visible name); [asked] is settled even when it is not among them. */
              fun learn(apps: Collection<Pair<String, String>>, asked: String? = null) {
                  if (!active) return
                  for ((packageName, label) in apps) {
                      if (known[packageName] != true) known[packageName] = matches(packageName, label)
                  }
                  if (asked != null && !known.containsKey(asked)) known[asked] = matches(asked, null)
              }

              /** True when [packageName] is on the list, by its package name, by [label], or by a name learned earlier. */
              fun locks(packageName: String?, label: String? = null): Boolean {
                  if (packageName == null || !active) return false
                  if (known[packageName] == true) return true
                  val hit = matches(packageName, label)
                  if (hit) known[packageName] = true
                  return hit
              }

              private fun matches(packageName: String, label: String?): Boolean {
                  val pkg = packageName.lowercase()
                  val parts = label?.lowercase()?.split(NOT_LETTERS)?.filter { it.isNotEmpty() }.orEmpty()
                  return words.any { word -> word in pkg || inName(word, parts) }
              }

              private fun inName(word: String, parts: List<String>): Boolean =
                  parts.indices.any { i -> word in parts[i] || parts.subList(i, parts.size).joinToString("").startsWith(word) }

              private fun letters(text: String): String = text.lowercase().filter { it.isLetterOrDigit() }
          }
          '''

          HELPER = '''    /** True for an app on the owner's lock list (see [OwnerLock]); app names are read when a new app shows up. */
              private suspend fun ownerLocked(pkg: String?): Boolean {
                  if (pkg == null || !OwnerLock.active) return false
                  if (OwnerLock.unknown(pkg)) OwnerLock.learn(device.installedApps().map { it.packageName to it.label }, pkg)
                  return OwnerLock.locks(pkg)
              }

          '''

          # (file, text that must appear exactly once, what replaces it)
          PATCHES = [
              (
                  "agent/ToolExecutor.kt",
                  "import com.phoneuse.risk.RiskCategory\n",
                  "import com.phoneuse.risk.RiskCategory\nimport com.phoneuse.security.OwnerLock\n",
              ),
              (  # Refuse taps, typing and scrolling while a locked app is in front.
                  "agent/ToolExecutor.kt",
                  "(screen.captureBlocked || protectedApps[screen.packageName] == true)\n",
                  "(screen.captureBlocked || protectedApps[screen.packageName] == true || ownerLocked(screen.packageName))\n",
              ),
              (  # Refuse to open a locked app.
                  "agent/ToolExecutor.kt",
                  '                val pkg = args.str("package") ?: findPackage(args.str("name") ?: throw ArgException("package or name required"))\n',
                  '                val pkg = args.str("package") ?: findPackage(args.str("name") ?: throw ArgException("package or name required"))\n'
                  "                if (ownerLocked(pkg)) throw StepFail(OwnerLock.NOTICE)\n",
              ),
              (  # Never publish a locked app's screen: this check runs before any screenshot is taken.
                  "agent/ToolExecutor.kt",
                  "        if (protectedApps[pkg] == true) throw WithheldScreen(screen)\n",
                  "        if (protectedApps[pkg] == true || ownerLocked(pkg)) throw WithheldScreen(screen)\n",
              ),
              (  # Tell the model why, in place of the screen.
                  "agent/ToolExecutor.kt",
                  "        val notice = if (protectedApps[screen.packageName] == true) PROTECTED else CAPTURE_FAILED\n",
                  "        val notice = if (OwnerLock.locks(screen.packageName)) OwnerLock.NOTICE\n"
                  "        else if (protectedApps[screen.packageName] == true) PROTECTED else CAPTURE_FAILED\n",
              ),
              (
                  "agent/ToolExecutor.kt",
                  "    private suspend fun findPackage(name: String): String {\n",
                  HELPER + "    private suspend fun findPackage(name: String): String {\n",
              ),
              (  # Drop a locked app's notifications before they are stored, so no later feature can read them.
                  "phone/PhoneUseNotificationListener.kt",
                  "        if (sbn.packageName == packageName) return null\n",
                  "        if (sbn.packageName == packageName) return null\n"
                  "        if (com.phoneuse.security.OwnerLock.locks(sbn.packageName, label(sbn.packageName))) return null\n",
              ),
          ]


          def main() -> None:
              words = lock_words()

              security = SRC / "security"
              (security / "OwnerLock.kt").write_text(OWNER_LOCK, encoding="utf-8")
              listed = ", ".join(f'"{w}"' for w in words)
              (security / "OwnerLockWords.kt").write_text(
                  "package com.phoneuse.security\n\n"
                  "/** Written by the build from the owner's private list. */\n"
                  "internal object OwnerLockWords {\n"
                  f"    val WORDS: List<String> = listOf<String>({listed})\n"
                  "}\n",
                  encoding="utf-8",
              )

              for path, old, new in PATCHES:
                  file = SRC / path
                  text = file.read_text(encoding="utf-8")
                  found = text.count(old)
                  if found != 1:
                      stop(f"The lock could not be attached in {path} (expected 1 place, found {found}). The app's code has changed; the lock needs updating.")
                  file.write_text(text.replace(old, new), encoding="utf-8")

              print(f"Lock attached in {len(PATCHES)} places. Apps on the list: {len(words)}.")


          if __name__ == "__main__":
              main()
          LOCK_PY

      # "Hey Thonix": a listener on the phone itself that opens the assistant by voice.
      - name: Add the wake word listener
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets/kws wake-download
          curl -sSfL --retry 3 -o app/libs/sherpa-onnx.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar"
          curl -sSfL --retry 3 -o wake-download/model.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2"
          # Only the exact files this listener was tested with are accepted; anything else stops the build.
          sha256sum -c - <<'SUMS'
          4c766e2e74c9d33d595338c21fe3b305c73ba45d47e96a235675c33142a2ec50  app/libs/sherpa-onnx.aar
          f170013b4716e41b62b9bfd809687c207cef798ef9bc6534d524e17af9b6561a  wake-download/model.tar.bz2
          SUMS
          tar xjf wake-download/model.tar.bz2 -C wake-download
          M=wake-download/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          cp "$M/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx" app/src/main/assets/kws/encoder.onnx
          cp "$M/decoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx" app/src/main/assets/kws/decoder.onnx
          cp "$M/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx" app/src/main/assets/kws/joiner.onnx
          cp "$M/tokens.txt" app/src/main/assets/kws/tokens.txt
          rm -rf wake-download
          python3 - <<'WAKE_PY'
          """Adds the "Hey Thonix" wake word listener and its status screen to the app's code before it is built.

          Runs on GitHub during the build, after the engine library and its voice model have
          been downloaded and checked. Every change to existing code is verified: if the app's
          code has moved and a change cannot be made in exactly the expected place, the build
          stops instead of producing an app with a half-attached listener.
          """

          import pathlib
          import sys

          APP = pathlib.Path("app")
          SRC = APP / "src/main/java/com/phoneuse"


          def stop(message: str) -> None:
              print(f"::error::{message}")
              sys.exit(1)


          # The phrase as the voice model spells it, in the model's own word pieces. Several spellings of the
          # same sound, because "Thonix" is not a dictionary word. All of them mean the same wake word.
          SPELLINGS = [
              "▁HE Y ▁TO N I X",
              "▁HE Y ▁TO N IC S",
              "▁HE Y ▁TO N N I X",
              "▁HE Y ▁TH ON I X",
              "▁HE Y ▁TH ON IC S",
              "▁HE Y ▁TH ON N I X",
          ]
          # Looser spellings, used only by the two more sensitive settings.
          MORE_SPELLINGS = [
              "▁HE Y ▁TO N E X",
              "▁HE Y ▁TA W N I X",
              "▁HE Y ▁T O N I X",
          ]
          MOST_SPELLINGS = [
              "▁A ▁TO N I X",
              "▁E ▁TO N I X",
          ]
          # The sensitivity settings of the "Hey Thonix" screen, strictest first: (spellings, boost, threshold).
          # A higher boost or a lower threshold hears the phrase more easily, and misfires more.
          LEVELS = [
              (SPELLINGS, "1.5", "0.25"),
              (SPELLINGS, "2", "0.15"),
              (SPELLINGS + MORE_SPELLINGS, "3", "0.08"),
              (SPELLINGS + MORE_SPELLINGS + MOST_SPELLINGS, "4", "0.03"),
          ]

          WAKEWORD = r'''package com.phoneuse.wake

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.SystemClock
          import android.util.Log
          import com.phoneuse.assist.PhoneUseVoiceService

          /**
           * "Hey Thonix": the switch, the settings and the shared state of the wake word listener ([WakeWordService]).
           *
           * The listener holds the microphone only while it may: the switch is on, the screen is on and unlocked, and
           * the app's own voice input is not running (two captures at once would silence one of them).
           *
           * Nothing here fails quietly: whatever keeps the listener from listening is kept as [problem], in words, and
           * shown on the status screen ([WakeStatusActivity]).
           */
          object WakeWord {
              const val TAG = "WakeWord"

              /** Set on the assistant session's arguments when the wake word opened it, so it listens at once. */
              const val EXTRA_WAKE = "com.phoneuse.wake.WOKEN"

              /** How easily the phrase is accepted, strictest first. Each has its own keywords file in the assets. */
              val LEVELS = listOf("Strict", "Normal", "Sensitive", "Very sensitive")
              const val DEFAULT_LEVEL = 1

              private const val PREFS = "wake_word"
              private const val KEY_ENABLED = "enabled"
              private const val KEY_LEVEL = "level"
              private const val KEY_PROBLEM = "problem"

              /** How long the listener stays off the microphone after the app's own voice input ends. */
              private const val AFTER_VOICE_MS = 1_200L

              /** True while the app's own voice input holds the microphone. */
              @Volatile
              var voiceBusy = false
                  private set

              /** The listener stays off the microphone until this moment ([SystemClock.elapsedRealtime]). */
              @Volatile
              private var holdUntil = 0L

              /** True while [WakeWordService] is up. */
              @Volatile
              var running = false
                  internal set

              /** What the running listener is doing right now, in words. */
              @Volatile
              var state = ""
                  internal set

              /** Loudness of the last tenth of a second the listener heard, 0 to 100. Proof that sound is arriving. */
              @Volatile
              var micLevel = 0
                  internal set

              /** How many times the phrase was heard since the app started, and when last ([SystemClock.elapsedRealtime]). */
              @Volatile
              var heard = 0
                  internal set

              @Volatile
              var heardAt = 0L
                  internal set

              /** True while the status screen is in front: hearing the phrase buzzes and counts, and opens nothing. */
              @Volatile
              var testing = false

              private fun prefs(context: Context) = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun enabled(context: Context): Boolean = prefs(context).getBoolean(KEY_ENABLED, true)

              fun setEnabled(context: Context, on: Boolean) {
                  prefs(context).edit().putBoolean(KEY_ENABLED, on).apply()
                  if (on) ensureRunning(context) else context.stopService(Intent(context, WakeWordService::class.java))
              }

              fun level(context: Context): Int = prefs(context).getInt(KEY_LEVEL, DEFAULT_LEVEL).coerceIn(0, LEVELS.lastIndex)

              /** Changes the sensitivity; a running listener loads the new setting at once. */
              fun setLevel(context: Context, level: Int) {
                  val wanted = level.coerceIn(0, LEVELS.lastIndex)
                  if (wanted == level(context)) return
                  prefs(context).edit().putInt(KEY_LEVEL, wanted).apply()
                  if (running) {
                      try {
                          context.startService(Intent(context, WakeWordService::class.java).setAction(WakeWordService.ACTION_RELOAD))
                      } catch (e: RuntimeException) {
                          Log.w(TAG, "the new sensitivity will load the next time the listener starts", e)
                      }
                  }
              }

              /** Why the listener is not listening, or null when nothing is known to be wrong. Survives app restarts. */
              fun problem(context: Context): String? = prefs(context).getString(KEY_PROBLEM, null)

              internal fun report(context: Context, problem: String?) {
                  if (problem != null) Log.w(TAG, problem)
                  if (problem == problem(context)) return
                  prefs(context).edit().apply { if (problem == null) remove(KEY_PROBLEM) else putString(KEY_PROBLEM, problem) }.apply()
              }

              /**
               * Starts the listener when the switch is on. Safe to call often.
               *
               * It starts only while this app is the phone's assistant and may use the microphone: Android lets the
               * assistant hold the microphone in the background, and a start it would refuse is never attempted.
               */
              fun ensureRunning(context: Context) {
                  if (running || !enabled(context)) return
                  if (!PhoneUseVoiceService.ready) {
                      report(context, "Android has not connected Thonix as the phone's assistant. Open Thonix once with the corner swipe, then come back here.")
                      return
                  }
                  if (context.checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      report(context, "Thonix is not allowed to use the microphone.")
                      return
                  }
                  try {
                      context.startForegroundService(Intent(context, WakeWordService::class.java))
                  } catch (e: RuntimeException) {
                      // Refused from the background in this state; the next time the assistant or the status screen opens tries again.
                      report(context, "Android refused to start the listener from the background. (${describe(e)})")
                  }
              }

              internal fun describe(e: Throwable): String = e.javaClass.simpleName + (e.message?.let { ": " + it.take(300) } ?: "")

              /** Called by the app's voice input whenever it becomes active or idle. */
              fun voiceInput(active: Boolean) {
                  if (voiceBusy && !active) hold(AFTER_VOICE_MS)
                  voiceBusy = active
              }

              /** Keeps the listener off the microphone for [ms] from now. */
              fun hold(ms: Long) {
                  holdUntil = maxOf(holdUntil, SystemClock.elapsedRealtime() + ms)
              }

              fun mayListen(): Boolean = !voiceBusy && SystemClock.elapsedRealtime() >= holdUntil
          }
          '''

          WAKEWORDSERVICE = r'''package com.phoneuse.wake

          import android.app.KeyguardManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.util.Log
          import com.k2fsa.sherpa.onnx.FeatureConfig
          import com.k2fsa.sherpa.onnx.KeywordSpotter
          import com.k2fsa.sherpa.onnx.KeywordSpotterConfig
          import com.k2fsa.sherpa.onnx.OnlineModelConfig
          import com.k2fsa.sherpa.onnx.OnlineTransducerModelConfig
          import com.phoneuse.assist.PhoneUseVoiceService
          import kotlin.math.abs
          import kotlin.math.sqrt

          /**
           * Listens for "Hey Thonix" on the device and opens the assistant when it hears it. Nothing it hears leaves the
           * phone: the audio goes to a small on-device model and is dropped.
           *
           * A foreground service of type microphone, with a notification that can turn it off. It listens only while
           * the screen is on and unlocked, and lets go of the microphone whenever the app's own voice input needs it.
           * What it is doing, and anything that stops it, is published through [WakeWord] for the status screen.
           */
          class WakeWordService : Service() {
              private var listener: Listener? = null
              private val main = Handler(Looper.getMainLooper())

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_TURN_OFF -> {
                          WakeWord.setEnabled(applicationContext, false)
                          return START_NOT_STICKY
                      }
                      ACTION_RELOAD -> {
                          // Sent with a plain start, so only a listener that is already up is replaced.
                          if (listener == null) {
                              stopSelf()
                              return START_NOT_STICKY
                          }
                          replaceListener()
                          return START_STICKY
                      }
                  }
                  if (!enterForeground()) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (listener == null) replaceListener()
                  return START_STICKY
              }

              private fun replaceListener() {
                  listener?.stop()
                  WakeWord.running = true
                  WakeWord.state = "Loading the voice engine"
                  listener = Listener(WakeWord.level(applicationContext)).also { it.start() }
              }

              /**
               * A service started with startForegroundService must enter the foreground or Android stops the whole
               * app. If the microphone type is refused, it enters with the plain type, so it can leave cleanly.
               */
              private fun enterForeground(): Boolean {
                  val notice = notification()
                  try {
                      startForeground(NOTIFICATION_ID, notice, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                      return true
                  } catch (e: RuntimeException) {
                      WakeWord.report(
                          applicationContext,
                          "Android would not give the listener the microphone in the background. Tap Start listening on this screen. (${WakeWord.describe(e)})",
                      )
                  }
                  try {
                      startForeground(NOTIFICATION_ID, notice, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                      stopForeground(STOP_FOREGROUND_REMOVE)
                  } catch (e: RuntimeException) {
                      Log.w(WakeWord.TAG, "could not enter the foreground at all", e)
                  }
                  return false
              }

              override fun onDestroy() {
                  listener?.stop()
                  listener = null
                  WakeWord.running = false
                  WakeWord.state = ""
                  WakeWord.micLevel = 0
                  super.onDestroy()
              }

              /** The listener gave up: say why on the status screen and take the service down. */
              private fun failed(from: Listener, problem: String) {
                  main.post {
                      if (listener !== from) return@post
                      WakeWord.report(applicationContext, problem)
                      stopSelf()
                  }
              }

              /** One run of the listening loop on its own thread, at one sensitivity. Replaced, never reused. */
              private inner class Listener(private val level: Int) {
                  @Volatile
                  private var alive = true
                  private val thread = Thread({ listen() }, "wake-word")

                  fun start() = thread.start()

                  fun stop() {
                      alive = false
                      thread.interrupt()
                  }

                  private fun say(state: String) {
                      if (alive) WakeWord.state = state
                  }

                  private fun listen() {
                      val spotter = try {
                          KeywordSpotter(assets, config(level))
                      } catch (e: Throwable) {
                          failed(this, "The voice engine did not load. (${WakeWord.describe(e)})")
                          return
                      }
                      val power = getSystemService(PowerManager::class.java)
                      val keyguard = getSystemService(KeyguardManager::class.java)
                      val pcm = ShortArray(FRAME)
                      val ears = Ears(spotter)
                      var recorder: AudioRecord? = null
                      var usable = false
                      var checkedAt = 0L
                      var silentFrames = 0
                      try {
                          while (alive) {
                              val now = SystemClock.elapsedRealtime()
                              if (now - checkedAt >= STATE_CHECK_MS) {
                                  usable = power.isInteractive && !keyguard.isKeyguardLocked
                                  checkedAt = now
                              }
                              if (!usable || !WakeWord.mayListen()) {
                                  recorder = close(recorder)
                                  WakeWord.micLevel = 0
                                  say(if (!usable) "Waiting: the screen is off or locked" else "Waiting: Thonix is using the microphone")
                                  Thread.sleep(IDLE_MS)
                                  continue
                              }
                              var mic = recorder
                              if (mic == null) {
                                  mic = open()
                                  if (mic == null) {
                                      say("The microphone would not open. Another app may be using it.")
                                      Thread.sleep(RETRY_MS)
                                      continue
                                  }
                                  recorder = mic
                                  silentFrames = 0
                                  // What was half heard before the pause must not complete a phrase now.
                                  ears.fresh()
                              }
                              val read = mic.read(pcm, 0, FRAME)
                              if (read <= 0) {
                                  recorder = close(recorder)
                                  say("The microphone stopped giving sound. Trying again.")
                                  Thread.sleep(RETRY_MS)
                                  continue
                              }
                              var peak = 0
                              for (i in 0 until read) peak = maxOf(peak, abs(pcm[i].toInt()))
                              WakeWord.micLevel = (sqrt(peak / 32768.0) * 100).toInt().coerceIn(0, 100)
                              // Android hands a background app silence instead of an error when it withholds the microphone.
                              silentFrames = if (peak == 0) silentFrames + 1 else 0
                              if (silentFrames >= SILENT_FRAMES) {
                                  say("The microphone is open but Android is sending silence. Tap Turn off, then Start listening.")
                              } else {
                                  say("Listening")
                                  if (silentFrames == 0) WakeWord.report(applicationContext, null)
                              }
                              if (ears.hear(FloatArray(read) { pcm[it] / 32768f }) && alive) {
                                  ears.fresh()
                                  WakeWord.heard += 1
                                  WakeWord.heardAt = SystemClock.elapsedRealtime()
                                  if (WakeWord.testing) {
                                      main.post { buzz() }
                                  } else {
                                      // Off the microphone before the assistant's own voice input opens it.
                                      recorder = close(recorder)
                                      WakeWord.hold(AFTER_WAKE_MS)
                                      main.post { woken() }
                                  }
                              }
                          }
                      } catch (e: InterruptedException) {
                          // Stopped or replaced.
                      } catch (e: RuntimeException) {
                          failed(this, "The listener stopped unexpectedly. (${WakeWord.describe(e)})")
                      } finally {
                          close(recorder)
                          ears.release()
                          spotter.release()
                      }
                  }
              }

              /**
               * Turns microphone sound into "the phrase was just said". Two things here were measured, not guessed:
               *
               * Quiet sound is levelled up first. The voice model misses speech that arrives very quiet, which is what a
               * phone at arm's length gives. The level is set a few frames ahead of the sound it is applied to, so a word
               * is not louder at its start than at its end.
               *
               * Several overlapping listens, each started fresh on a fixed schedule. The engine clears a listen's memory
               * after about two seconds without speech, and a phrase that begins just before that is lost. With listens
               * started a third of that time apart, a phrase always falls well inside at least one of them.
               */
              private class Ears(private val spotter: KeywordSpotter) {
                  private val streams = Array(LISTENS) { spotter.createStream() }

                  /** Samples each listen has taken in its current life; below zero while it waits for its staggered start. */
                  private val taken = IntArray(LISTENS)
                  private val ahead = java.util.ArrayDeque<FloatArray>()
                  private var loudest = 0f

                  init {
                      stagger()
                  }

                  private fun stagger() {
                      for (i in taken.indices) taken[i] = -(i * LIFE / LISTENS)
                  }

                  /** Forgets everything heard so far. */
                  fun fresh() {
                      for (i in streams.indices) {
                          streams[i].release()
                          streams[i] = spotter.createStream()
                      }
                      stagger()
                      ahead.clear()
                      loudest = 0f
                  }

                  fun release() {
                      for (stream in streams) stream.release()
                  }

                  /** Takes the next stretch of sound, samples from -1 to 1. True when the phrase was heard. */
                  fun hear(frame: FloatArray): Boolean {
                      var peak = 0f
                      for (sample in frame) peak = maxOf(peak, abs(sample))
                      loudest = maxOf(peak, loudest * FADE)
                      ahead.addLast(frame)
                      if (ahead.size <= LOOK_AHEAD) return false
                      val due = ahead.removeFirst()
                      val gain = if (loudest > 0f) (FULL / loudest).coerceIn(1f, MOST_GAIN) else 1f
                      if (gain != 1f) for (i in due.indices) due[i] = (due[i] * gain).coerceIn(-1f, 1f)
                      var heard = false
                      for (i in streams.indices) if (give(i, due)) heard = true
                      return heard
                  }

                  private fun give(index: Int, frame: FloatArray): Boolean {
                      var heard = false
                      var from = 0
                      if (taken[index] < 0) {
                          from = minOf(frame.size, -taken[index])
                          taken[index] += from
                      }
                      while (from < frame.size) {
                          val count = minOf(frame.size - from, LIFE - taken[index])
                          val stream = streams[index]
                          stream.acceptWaveform(if (count == frame.size) frame else frame.copyOfRange(from, from + count), SAMPLE_RATE)
                          taken[index] += count
                          from += count
                          while (spotter.isReady(stream)) {
                              spotter.decode(stream)
                              if (spotter.getResult(stream).keyword.isNotBlank()) {
                                  heard = true
                                  spotter.reset(stream)
                              }
                          }
                          if (taken[index] >= LIFE) {
                              stream.release()
                              streams[index] = spotter.createStream()
                              taken[index] = 0
                          }
                      }
                      return heard
                  }
              }

              private fun woken() {
                  buzz()
                  val shown = PhoneUseVoiceService.show(Bundle().apply { putBoolean(WakeWord.EXTRA_WAKE, true) })
                  if (!shown) {
                      WakeWord.report(applicationContext, "Heard \"Hey Thonix\", but Android did not let Thonix open. Check that Thonix is still the phone's assistant.")
                  }
              }

              @Suppress("DEPRECATION") // getSystemService(Vibrator) is fine down to minSdk 30.
              private fun buzz() {
                  try {
                      getSystemService(Vibrator::class.java)?.vibrate(VibrationEffect.createOneShot(BUZZ_MS, VibrationEffect.DEFAULT_AMPLITUDE))
                  } catch (e: RuntimeException) {
                      // A phone without a vibrator, or one that refuses: the sheet opening is signal enough.
                  }
              }

              private fun open(): AudioRecord? {
                  val smallest = AudioRecord.getMinBufferSize(SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  if (smallest <= 0) return null
                  var mic: AudioRecord? = null
                  try {
                      mic = AudioRecord(
                          MediaRecorder.AudioSource.VOICE_RECOGNITION, SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT, maxOf(smallest, FRAME * 2 * 4),
                      )
                      if (mic.state == AudioRecord.STATE_INITIALIZED) {
                          mic.startRecording()
                          if (mic.recordingState == AudioRecord.RECORDSTATE_RECORDING) return mic
                      }
                  } catch (e: RuntimeException) {
                      Log.w(WakeWord.TAG, "the microphone could not be opened", e)
                  }
                  close(mic)
                  return null
              }

              /** Stops and frees [mic]; returns null so the caller can drop its reference in one line. */
              private fun close(mic: AudioRecord?): AudioRecord? {
                  if (mic != null) {
                      try {
                          if (mic.recordingState == AudioRecord.RECORDSTATE_RECORDING) mic.stop()
                      } catch (e: RuntimeException) {
                          // Already stopped.
                      }
                      mic.release()
                  }
                  return null
              }

              private fun config(level: Int) = KeywordSpotterConfig(
                  featConfig = FeatureConfig(sampleRate = SAMPLE_RATE, featureDim = 80),
                  modelConfig = OnlineModelConfig(
                      transducer = OnlineTransducerModelConfig(
                          encoder = "$MODEL_DIR/encoder.onnx",
                          decoder = "$MODEL_DIR/decoder.onnx",
                          joiner = "$MODEL_DIR/joiner.onnx",
                      ),
                      tokens = "$MODEL_DIR/tokens.txt",
                      numThreads = 1,
                      provider = "cpu",
                      modelType = "zipformer2",
                  ),
                  maxActivePaths = 4,
                  keywordsFile = "$MODEL_DIR/keywords-$level.txt",
                  numTrailingBlanks = 1,
              )

              private fun notification(): Notification {
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel(CHANNEL, "Wake word", NotificationManager.IMPORTANCE_LOW))
                  val immutable = PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  val turnOff = PendingIntent.getService(this, 0, Intent(this, WakeWordService::class.java).setAction(ACTION_TURN_OFF), immutable)
                  val status = PendingIntent.getActivity(this, 0, Intent(this, WakeStatusActivity::class.java), immutable)
                  return Notification.Builder(this, CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("Listening for \"Hey Thonix\"")
                      .setContentText("Only while the screen is on and unlocked. Nothing heard leaves the phone.")
                      .setContentIntent(status)
                      .setOngoing(true)
                      .addAction(Notification.Action.Builder(null, "Turn off", turnOff).build())
                      .build()
              }

              companion object {
                  const val ACTION_TURN_OFF = "com.phoneuse.wake.TURN_OFF"
                  const val ACTION_RELOAD = "com.phoneuse.wake.RELOAD"
                  private const val CHANNEL = "wake_word"
                  private const val NOTIFICATION_ID = 7341
                  private const val MODEL_DIR = "kws"
                  private const val SAMPLE_RATE = 16_000

                  /** A tenth of a second of audio per read. */
                  private const val FRAME = 1_600
                  private const val IDLE_MS = 300L
                  private const val RETRY_MS = 1_000L
                  private const val STATE_CHECK_MS = 1_000L

                  /** Three seconds of exact zeros is not a quiet room, it is a withheld microphone. */
                  private const val SILENT_FRAMES = 30

                  /** Overlapping listens, and how many samples each lives: just under the engine's own two-second clearing. */
                  private const val LISTENS = 3
                  private const val LIFE = 30_720

                  /** Levelling: frames looked ahead, how fast the remembered loudness fades per frame, the level aimed for, the most it may amplify. */
                  private const val LOOK_AHEAD = 3
                  private const val FADE = 0.98f
                  private const val FULL = 0.5f
                  private const val MOST_GAIN = 30f

                  /** Time for the assistant's voice input to open the microphone after a wake. */
                  private const val AFTER_WAKE_MS = 4_000L
                  private const val BUZZ_MS = 40L
              }
          }
          '''

          WAKESTATUSACTIVITY = r'''package com.phoneuse.wake

          import android.Manifest
          import android.app.Activity
          import android.app.role.RoleManager
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import com.phoneuse.assist.PhoneUseVoiceService

          /**
           * The "Hey Thonix" screen: what the wake word listener is doing, what is stopping it, and a place to test a
           * voice against it. While this screen is in front, hearing the phrase only buzzes and counts.
           *
           * Starting the listener from here always works when the permissions are in place, because Android lets an app
           * on screen start a microphone service; from the background that is Android's call.
           */
          class WakeStatusActivity : Activity() {
              private val ticker = Handler(Looper.getMainLooper())
              private val tick = object : Runnable {
                  override fun run() {
                      refresh()
                      ticker.postDelayed(this, REFRESH_MS)
                  }
              }

              private lateinit var status: TextView
              private lateinit var detail: TextView
              private lateinit var checks: TextView
              private lateinit var toggle: Button
              private lateinit var allowMic: Button
              private lateinit var allowNotices: Button
              private lateinit var chooseAssistant: Button
              private lateinit var meter: ProgressBar
              private lateinit var loudness: TextView
              private var loudest = 0
              private var loudestAt = 0L
              private lateinit var heard: TextView
              private lateinit var levelName: TextView
              private lateinit var levelBar: SeekBar

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val column = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      val edge = dp(20)
                      setPadding(edge, edge, edge, edge)
                  }

                  status = text(column, 24f, bold = true)
                  detail = text(column, 15f)
                  toggle = button(column, "") {
                      WakeWord.setEnabled(this, !WakeWord.enabled(this))
                      refresh()
                  }
                  allowMic = button(column, "Allow the microphone") { requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1) }
                  allowNotices = button(column, "Allow notifications") { requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 2) }
                  chooseAssistant = button(column, "Choose the assistant app") { open(Intent(Settings.ACTION_VOICE_INPUT_SETTINGS)) }

                  heading(column, "Test your voice")
                  text(column, 15f).text = "Say \"Hey Thonix\". While this screen is open it only buzzes and counts, it does not open Thonix. " +
                      "The bar shows what the microphone hears: it should jump when you speak."
                  meter = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply { max = 100 }
                  column.addView(meter, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(28)))
                  loudness = text(column, 13f)
                  heard = text(column, 20f, bold = true)

                  heading(column, "Sensitivity")
                  levelName = text(column, 15f)
                  levelBar = SeekBar(this).apply {
                      max = WakeWord.LEVELS.lastIndex
                      progress = WakeWord.level(this@WakeStatusActivity)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(bar: SeekBar, value: Int, fromUser: Boolean) {
                              if (fromUser) WakeWord.setLevel(this@WakeStatusActivity, value)
                              showLevel()
                          }

                          override fun onStartTrackingTouch(bar: SeekBar) = Unit
                          override fun onStopTrackingTouch(bar: SeekBar) = Unit
                      })
                  }
                  column.addView(levelBar, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(48)))
                  text(column, 13f).text = "Move right if it misses you. Move left if it wakes up when you did not call it."

                  heading(column, "Checks")
                  checks = text(column, 15f)
                  button(column, "Open Thonix's app settings") {
                      open(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.fromParts("package", packageName, null)))
                  }

                  setContentView(ScrollView(this).apply {
                      fitsSystemWindows = true
                      addView(column)
                  })
              }

              override fun onResume() {
                  super.onResume()
                  WakeWord.testing = true
                  // On screen is the one moment Android always allows the listener to start.
                  WakeWord.ensureRunning(this)
                  ticker.post(tick)
              }

              override fun onPause() {
                  ticker.removeCallbacks(tick)
                  WakeWord.testing = false
                  super.onPause()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  WakeWord.ensureRunning(this)
                  refresh()
              }

              private fun refresh() {
                  val on = WakeWord.enabled(this)
                  val running = WakeWord.running
                  val mic = granted(Manifest.permission.RECORD_AUDIO)
                  val notices = granted(Manifest.permission.POST_NOTIFICATIONS)
                  val assistant = getSystemService(RoleManager::class.java).isRoleHeld(RoleManager.ROLE_ASSISTANT)
                  val connected = PhoneUseVoiceService.ready
                  val battery = getSystemService(PowerManager::class.java).isIgnoringBatteryOptimizations(packageName)

                  status.text = when {
                      !on -> "Off"
                      running -> WakeWord.state.ifBlank { "Starting" }
                      else -> "Not listening"
                  }
                  detail.text = when {
                      !on -> "Tap Start listening."
                      running -> ""
                      else -> WakeWord.problem(this) ?: "Tap Turn off, then Start listening."
                  }
                  detail.visibility = if (detail.text.isEmpty()) View.GONE else View.VISIBLE
                  toggle.text = if (on) "Turn off" else "Start listening"
                  allowMic.visibility = if (mic) View.GONE else View.VISIBLE
                  allowNotices.visibility = if (notices) View.GONE else View.VISIBLE
                  chooseAssistant.visibility = if (assistant) View.GONE else View.VISIBLE

                  val level = if (running) WakeWord.micLevel else 0
                  val now = SystemClock.elapsedRealtime()
                  if (level >= loudest || now - loudestAt > LOUDEST_HOLD_MS) {
                      loudest = level
                      loudestAt = now
                  }
                  meter.progress = level
                  loudness.text = "Loudest in the last few seconds: $loudest out of 100"
                  val count = WakeWord.heard
                  heard.text = when {
                      count == 0 -> "Heard: not yet"
                      else -> "Heard: $count  (last ${(SystemClock.elapsedRealtime() - WakeWord.heardAt) / 1000} s ago)"
                  }
                  showLevel()

                  checks.text = listOf(
                      mark(on) + "The switch is on",
                      mark(assistant) + "Thonix is the phone's assistant",
                      mark(connected) + "Android has connected the assistant",
                      mark(mic) + "Microphone allowed",
                      mark(notices) + "Notifications allowed (only needed to show the Turn off notice)",
                      mark(battery) + "Battery unrestricted (helps it survive in the background)",
                  ).joinToString("\n")
              }

              private fun showLevel() {
                  levelName.text = WakeWord.LEVELS[levelBar.progress.coerceIn(0, WakeWord.LEVELS.lastIndex)]
              }

              private fun mark(ok: Boolean) = if (ok) "✓  " else "✗  "

              private fun granted(permission: String) = checkSelfPermission(permission) == PackageManager.PERMISSION_GRANTED

              private fun open(intent: Intent) {
                  try {
                      startActivity(intent)
                  } catch (e: RuntimeException) {
                      // This phone has no such settings page; the checks above still say what is missing.
                  }
              }

              private fun text(into: LinearLayout, size: Float, bold: Boolean = false): TextView = TextView(this).apply {
                  setTextSize(TypedValue.COMPLEX_UNIT_SP, size)
                  if (bold) setTypeface(typeface, Typeface.BOLD)
                  setTextIsSelectable(true)
                  setPadding(0, dp(6), 0, dp(6))
                  into.addView(this)
              }

              private fun heading(into: LinearLayout, title: String) {
                  text(into, 13f, bold = true).apply {
                      text = title.uppercase()
                      setPadding(0, dp(28), 0, dp(2))
                  }
              }

              private fun button(into: LinearLayout, label: String, onTap: () -> Unit): Button = Button(this).apply {
                  text = label
                  isAllCaps = false
                  setOnClickListener { onTap() }
                  into.addView(this, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
              }

              private fun dp(value: Int) = (value * resources.displayMetrics.density).toInt()

              private companion object {
                  const val REFRESH_MS = 150L
                  const val LOUDEST_HOLD_MS = 4_000L
              }
          }
          '''

          WAKETILESERVICE = r'''package com.phoneuse.wake

          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

